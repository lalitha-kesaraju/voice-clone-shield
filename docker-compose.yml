# Local Postgres with pgvector for Voice-Clone Shield dev.
# Usage: docker compose up -d   (then DATABASE_URL in backend/.env matches defaults)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield
      POSTGRES_DB: shield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
